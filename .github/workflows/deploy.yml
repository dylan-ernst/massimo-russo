name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Set under Settings > Secrets and variables > Actions > Variables
          VITE_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
          # Set VITE_BASE to / when the custom domain is live
          VITE_BASE: ${{ vars.VITE_BASE }}
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links like /biography load the app
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
